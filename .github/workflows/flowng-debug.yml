name: FlowNG debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - flowng/development

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout pinned native sources and nested submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: V2rayNG/**/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install Android platform and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Identify pinned HEV revision
        id: hev
        run: echo "revision=$(git -C hev-socks5-tunnel rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache native HEV binaries
        id: hev-cache
        uses: actions/cache@v4
        with:
          path: libs
          key: hev-${{ runner.os }}-ndk30-${{ steps.hev.outputs.revision }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build HEV JNI and root-mode binaries for all app ABIs
        if: steps.hev-cache.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Stage HEV binaries
        run: cp -r libs V2rayNG/app/

      - name: Download Xray AAR matching the pinned submodule revision
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git -C AndroidLibXrayLite rev-parse HEAD)
          tag=$(git -C AndroidLibXrayLite describe --tags --exact-match)
          echo "Pinned AndroidLibXrayLite revision: $revision ($tag)"
          mkdir -p V2rayNG/app/libs
          curl --fail --location --retry 3 \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/$tag/libv2ray.aar" \
            --output V2rayNG/app/libs/libv2ray.aar
          test -s V2rayNG/app/libs/libv2ray.aar

      - name: Assemble and test Play Store debug
        working-directory: V2rayNG
        shell: bash
        run: |
          set -euo pipefail
          # Upstream injects this same NDK revision in its release workflow.
          sed -i '10i\    ndkVersion = "30.0.16248370"' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --stacktrace :app:testPlaystoreDebugUnitTest :app:assemblePlaystoreDebug

      - name: Verify all VPN native libraries are packaged
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk_dir = Path('V2rayNG/app/build/outputs/apk/playstore/debug')
          apks = list(apk_dir.glob('*.apk'))
          if not apks:
              raise SystemExit(f'No debug APK in {apk_dir}')
          required = ('libhev-socks5-tunnel.so', 'libhevsockstun.so', 'libgojni.so')
          abis = ('arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64')
          for apk in apks:
              selected = abis if 'universal' in apk.name else tuple(abi for abi in abis if apk.name.endswith(f'_{abi}.apk'))
              if not selected:
                  raise SystemExit(f'Unknown ABI in {apk.name}')
              with ZipFile(apk) as zipped:
                  missing = [f'lib/{abi}/{name}' for abi in selected for name in required if f'lib/{abi}/{name}' not in zipped.namelist()]
              if missing:
                  raise SystemExit(f'{apk.name} is missing native VPN binaries: {missing}')
              print(f'{apk.name}: verified {", ".join(selected)} ({", ".join(required)})')
          PY

      - name: Upload installable debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: FlowNG-debug-apks
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error

      - name: Explain build failure
        if: failure()
        run: |
          echo 'Check the failing step above. Native inputs, Gradle stacktrace, and Android SDK versions are printed in this run.' >> "$GITHUB_STEP_SUMMARY"
